name: openclaw-console

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-console-app
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: 6280
      OPENCLAW_GATEWAY_URL: ws://127.0.0.1:18789
      OPENCLAW_OLLAMA_URL: ${OPENCLAW_OLLAMA_URL:-http://127.0.0.1:11434}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Defina OPENCLAW_GATEWAY_TOKEN no .env}
      OPENCLAW_CONSOLE_TOKEN: ${OPENCLAW_CONSOLE_TOKEN:?Defina OPENCLAW_CONSOLE_TOKEN no .env}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?Defina ELEVENLABS_API_KEY no .env}
      OPENCLAW_DEVICE_IDENTITY_PATH: /data/state/device.json
      OPENCLAW_AGENT_WORKSPACE_ROOT: ${OPENCLAW_AGENT_WORKSPACE_ROOT:-/data/.openclaw}
      OPENCLAW_SHARED_PROJECTS_PATH: ${OPENCLAW_SHARED_PROJECTS_PATH:-/data/workspace/projects}
    volumes:
      - ${OPENCLAW_STATE_DIR_HOST:-/home/alexandre/docker/openclaw/openclaw_state}/console-state:/data/state
      - ${OPENCLAW_STATE_DIR_HOST:-/home/alexandre/docker/openclaw/openclaw_state}:/data/.openclaw:rw,z
