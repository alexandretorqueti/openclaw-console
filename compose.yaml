name: openclaw-console

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: openclaw-console-app
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: 6280
      OPENCLAW_GATEWAY_URL: ws://127.0.0.1:18789
      OPENCLAW_OLLAMA_URL: ${OPENCLAW_OLLAMA_URL:-http://127.0.0.1:11434}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Defina OPENCLAW_GATEWAY_TOKEN no .env}
      OPENCLAW_CONSOLE_TOKEN: ${OPENCLAW_CONSOLE_TOKEN:?Defina OPENCLAW_CONSOLE_TOKEN no .env}
      OPENCLAW_DEVICE_IDENTITY_PATH: /data/state/device.json
      OPENCLAW_AGENT_WORKSPACE_ROOT: ${OPENCLAW_AGENT_WORKSPACE_ROOT:-/data/.openclaw}
      OPENCLAW_SHARED_PROJECTS_PATH: ${OPENCLAW_SHARED_PROJECTS_PATH:-/data/workspace/projects}
    volumes:
      - ${OPENCLAW_STATE_DIR_HOST:-/home/alexandre/containers/openclaw/openclaw_state}/console-state:/data/state
      - ${OPENCLAW_STATE_DIR_HOST:-/home/alexandre/containers/openclaw/openclaw_state}:/data/.openclaw:rw,z
      # CLI `lms` + estado do LM Studio: preparação de modelos locais com
      # evicção de ociosos (apps/server/src/local-model.ts). O `lms` descobre o
      # servidor via $HOME/.lmstudio; o container roda como uid 1000 (node),
      # mesmo dono dos arquivos no host. rw: o lms escreve estado interno.
      - ${OPENCLAW_LMSTUDIO_HOME_HOST:-/home/alexandre/.lmstudio}:/home/node/.lmstudio
