version: "3.9"

services:
  db:
    image: postgres:16
    container_name: openclaw-console-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: openclaw_console
    volumes:
      - openclaw-console-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  openclaw-console-db-data: {}
